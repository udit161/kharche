<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="coin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="60%" style="stop-color:#f4a000"/>
      <stop offset="100%" style="stop-color:#c47a00"/>
    </linearGradient>
    <linearGradient id="coin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe44d"/>
      <stop offset="60%" style="stop-color:#f4a000"/>
      <stop offset="100%" style="stop-color:#b06800"/>
    </linearGradient>
    <linearGradient id="coin3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc300"/>
      <stop offset="100%" style="stop-color:#a05800"/>
    </linearGradient>
    <linearGradient id="kgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0d4ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Coin stack (bottom coin) -->
  <ellipse cx="20" cy="23" rx="7" ry="2.8" fill="url(#coin3)"/>
  <rect x="13" y="19" width="14" height="4" fill="url(#coin3)"/>
  <ellipse cx="20" cy="19" rx="7" ry="2.8" fill="#ffc300"/>
  <ellipse cx="20" cy="19" rx="5.5" ry="1.8" fill="#ffe066" opacity="0.5"/>

  <!-- Coin stack (middle coin) -->
  <ellipse cx="20" cy="17" rx="7" ry="2.8" fill="url(#coin2)"/>
  <rect x="13" y="13" width="14" height="4" fill="url(#coin2)"/>
  <ellipse cx="20" cy="13" rx="7" ry="2.8" fill="#ffe44d"/>
  <ellipse cx="20" cy="13" rx="5.5" ry="1.8" fill="#fff5b0" opacity="0.5"/>

  <!-- Coin stack (top coin) -->
  <ellipse cx="20" cy="11" rx="7" ry="2.8" fill="url(#coin1)"/>
  <rect x="13" y="7" width="14" height="4" fill="url(#coin1)"/>
  <ellipse cx="20" cy="7" rx="7" ry="2.8" fill="#ffd700"/>
  <ellipse cx="20" cy="7" rx="5.5" ry="1.8" fill="#fff0a0" opacity="0.6"/>

  <!-- Letter K -->
  <text x="6" y="23" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="20" fill="url(#kgrad)" letter-spacing="-1">K</text>
</svg>